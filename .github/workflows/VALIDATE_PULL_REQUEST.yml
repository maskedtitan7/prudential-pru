name: Validate Pull Request (Track -> SIT/QA)

# --------------------------------------------------------------------------
# Personal-project version of the work VALIDATE_PULL_REQUEST.yml.
# Track -> SIT / QA validation: SGD, PMD, ESLint, authenticate, dry-run
# deploy (never a real deploy - this workflow only ever validates).
#
# NOTE: triggers on PRs targeting branches named "sit" and "qa". Rename the
# branches list below if your personal repo uses different names.
# --------------------------------------------------------------------------

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - sit
      - uat
    paths:
      - "force-app/**"

jobs:
  validate-pull-request:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Display PR Info
        run: |
          echo "Source Branch: ${{ github.head_ref }}"
          echo "Target Branch: ${{ github.base_ref }}"

      - name: Checkout Salesforce Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Salesforce CLI + sfdx-git-delta
        run: |
          npm install --global @salesforce/cli@latest
          echo y | sf plugins install sfdx-git-delta

      - name: Environment Sanity Check
        run: |
          sf --version
          sf plugins
          node -v

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch Target Branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Compute Merge Base
        id: mergebase
        run: |
          MERGE_BASE=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          echo "merge_base=$MERGE_BASE" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # SGD Delta
      # ----------------------------------------------------------------------
      - name: Generate Delta Package
        run: |
          mkdir force-app-delta
          sf sgd source delta \
            --to HEAD \
            --from "${{ steps.mergebase.outputs.merge_base }}" \
            --output-dir force-app-delta \
            --source-dir force-app \
            --api-version 66.0 \
            --generate-delta

      - name: Show Delta Structure
        run: ls -R force-app-delta || echo "No delta generated"

      - name: Print Generated package.xml
        run: |
          if [ -f force-app-delta/package/package.xml ]; then
            echo "================ PACKAGE.XML ================"
            cat force-app-delta/package/package.xml
          else
            echo "No package.xml generated"
          fi

      - name: Print Generated destructiveChanges.xml
        run: |
          if [ -f force-app-delta/destructiveChanges/destructiveChanges.xml ]; then
            echo "========== DESTRUCTIVE CHANGES XML =========="
            cat force-app-delta/destructiveChanges/destructiveChanges.xml
          else
            echo "No destructiveChanges.xml generated"
          fi

      # ----------------------------------------------------------------------
      # Resolve Environment From Branch
      # ----------------------------------------------------------------------
      - name: Resolve Environment Mapping
        id: resolve_env
        run: |
          case "${{ github.base_ref }}" in
            sit)
              ENV_NAME="SIT"
              AUTH_SECRET="SF_AUTH_URL_SIT"
              ;;
            uat)
              ENV_NAME="UAT"
              AUTH_SECRET="SF_AUTH_URL_UAT"
              ;;
            *)
              echo "::error::Branch '${{ github.base_ref }}' not supported. Exiting."
              exit 1
              ;;
          esac

          echo "Resolved Environment: $ENV_NAME"
          echo "Using Auth Secret: $AUTH_SECRET"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "auth_secret=$AUTH_SECRET" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # PMD + ESLint on Delta
      # ----------------------------------------------------------------------
      - name: Download PMD
        run: |
          PMD_VERSION="7.1.0"
          curl -sSL "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip" -o pmd.zip
          unzip -q pmd.zip
          echo "PMD_HOME=$(pwd)/pmd-bin-${PMD_VERSION}" >> "$GITHUB_ENV"

      - name: Run PMD Scan on Delta
        continue-on-error: true
        run: |
          if [ -d "./force-app-delta/force-app" ]; then
            "$PMD_HOME/bin/pmd" check \
              --dir "./force-app-delta/force-app" \
              --rulesets category/apex/bestpractices.xml,category/apex/security.xml,category/apex/errorprone.xml \
              --format csv \
              --report-file pmd-delta-report.csv \
              --minimum-priority 3 \
              --no-progress
          else
            echo "No delta folder, skipping PMD"
          fi

      - name: Upload PMD Delta Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PMD-Delta-Report-${{ steps.resolve_env.outputs.env_name }}
          path: pmd-delta-report.csv
          if-no-files-found: ignore

      - name: Run LWC ESLint Scan (Delta Only)
        id: eslint
        continue-on-error: true
        run: |
          if [ ! -d "force-app-delta/force-app" ]; then
            echo "No delta folder found. Skipping ESLint scan."
            exit 0
          fi
          npm install
          npx eslint "./force-app-delta/force-app/**/*.js" \
            --no-error-on-unmatched-pattern \
            --format json \
            --output-file eslint-report.json || true

      - name: Upload ESLint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ESLint-Delta-Report-${{ steps.resolve_env.outputs.env_name }}
          path: eslint-report.json
          if-no-files-found: ignore

      # ----------------------------------------------------------------------
      # Authenticate to Target Org (Dynamic Secret Selection)
      # ----------------------------------------------------------------------
      - name: Authenticate to Target Org
        run: |
          case "${{ steps.resolve_env.outputs.auth_secret }}" in
            SF_AUTH_URL_SIT)
              AUTH_VALUE="${{ secrets.SF_AUTH_URL_SIT }}"
              ;;
            SF_AUTH_URL_UAT)
              AUTH_VALUE="${{ secrets.SF_AUTH_URL_UAT }}"
              ;;
            *)
              echo "::error::No matching auth secret found"
              exit 1
              ;;
          esac

          if [ -z "$AUTH_VALUE" ]; then
            echo "::error::Auth secret is empty!"
            exit 1
          fi

          echo "$AUTH_VALUE" > token.txt
          sf auth sfdxurl store -f token.txt -a myOrg -s
          rm token.txt

      - name: Verify Auth
        run: sf org list

      # ----------------------------------------------------------------------
      # Validate to Target Org (DRY-RUN ONLY)
      # ----------------------------------------------------------------------
      - name: Delta Validation to Target Org
        run: |
          if [ ! -f force-app-delta/package/package.xml ]; then
            echo "No SF changes found. Validation skipped."
            exit 0
          fi

          NUMBER_OF_COMPONENTS=$(grep -o "<members>" force-app-delta/package/package.xml | wc -l)

          node -e '
            const fs = require("fs");
            const xml = fs.readFileSync("force-app-delta/package/package.xml", "utf8");
            const isTestName = n => /Test/i.test(n) || /Tests?$/i.test(n);
            const apexMembers = [];
            for (const block of xml.matchAll(/<types>([\s\S]*?)<\/types>/g)) {
              const typeName = (block[1].match(/<name>([^<]+)<\/name>/) || [])[1];
              if (typeName === "ApexClass" || typeName === "ApexTrigger") {
                for (const m of block[1].matchAll(/<members>([^<]+)<\/members>/g)) {
                  apexMembers.push(m[1].trim());
                }
              }
            }
            fs.writeFileSync("delta_tests.txt", apexMembers.filter(isTestName).sort().join("\n"));
            fs.writeFileSync("changed_apex.txt", apexMembers.filter(n => !isTestName(n)).sort().join("\n"));
          '

          mapfile -t DELTA_TESTS < <(sed '/^$/d' delta_tests.txt)
          mapfile -t CHANGED_APEX < <(sed '/^$/d' changed_apex.txt)

          if [ ${#DELTA_TESTS[@]} -eq 0 ] && [ ${#CHANGED_APEX[@]} -eq 0 ]; then
            echo "Validating Delta and NOT running Apex tests ($NUMBER_OF_COMPONENTS components)"
            sf project deploy start \
              --ignore-warnings \
              --manifest force-app-delta/package/package.xml \
              --test-level NoTestRun \
              --dry-run \
              --target-org myOrg \
              --wait 100 \
              --api-version 66.0 \
              --json | tee deploy-result.json

          else
            echo "Apex detected in delta."

            CONVENTION_TESTS=()
            MISSING_CLASSES=()
            for cls in "${CHANGED_APEX[@]}"; do
              [ -z "$cls" ] && continue
              FOUND_FOR_CLASS=0
              while IFS= read -r candidate; do
                [ -z "$candidate" ] && continue
                base="$(basename "$candidate" .cls)"
                if [[ "$base" =~ ^[Tt]est ]] || [[ "$base" =~ [Tt]ests?$ ]]; then
                  CONVENTION_TESTS+=("$base")
                  FOUND_FOR_CLASS=1
                fi
              done < <(find force-app -type f -iname "*${cls}*.cls")

              if [ "$FOUND_FOR_CLASS" -eq 0 ]; then
                MISSING_CLASSES+=("$cls")
              fi
            done

            mapfile -t TESTS < <(printf '%s\n' "${DELTA_TESTS[@]}" "${CONVENTION_TESTS[@]}" | sed '/^$/d' | sort -u)

            if [ ${#MISSING_CLASSES[@]} -gt 0 ]; then
              for missing in "${MISSING_CLASSES[@]}"; do
                echo "::warning::  - $missing has no corresponding test class found (neither in the delta nor in force-app)"
              done
            fi

            if [ ${#TESTS[@]} -eq 0 ]; then
              echo "::error::No test classes found for any changed Apex Class/Trigger. Please add/commit respective Test Classes."
              exit 1
            fi

            echo "Test classes to run: ${TESTS[*]}"

            TEST_FLAGS=()
            for t in "${TESTS[@]}"; do
              TEST_FLAGS+=(--tests "$t")
            done

            sf project deploy start \
              --ignore-warnings \
              --manifest force-app-delta/package/package.xml \
              --test-level RunSpecifiedTests \
              "${TEST_FLAGS[@]}" \
              --dry-run \
              --target-org myOrg \
              --wait 100 \
              --api-version 66.0 \
              --json | tee deploy-result.json
          fi

      # ----------------------------------------------------------------------
      # Apex Test Results & Coverage Summary
      # ----------------------------------------------------------------------
      - name: Apex Test Results & Coverage Summary
        if: always()
        run: |
          if [ ! -f deploy-result.json ]; then
            echo "No deploy-result.json found - no tests were run."
            exit 0
          fi

          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("deploy-result.json", "utf8"));
            const result = payload.result || {};
            const rt = (result.details && result.details.runTestResult) || result.runTestResult;

            if (!rt) {
              console.log("No Apex tests were run as part of this validation.");
              process.exit(0);
            }

            const successes = rt.successes || [];
            const failures = rt.failures || [];
            const coverage = (rt.codeCoverage || []).slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""));

            console.log(`Tests run: ${rt.numTestsRun || successes.length + failures.length} | Failures: ${rt.numFailures || failures.length}`);
            console.log("");
            console.log("Class | Method | Result");
            console.log("----- | ------ | ------");
            for (const s of successes) console.log(`${s.name} | ${s.methodName} | PASS`);
            for (const f of failures) console.log(`${f.name} | ${f.methodName} | FAIL - ${(f.message || "").replace(/\n/g, " ")}`);

            console.log("");
            console.log("Class | Covered | Total | Coverage %");
            console.log("----- | ------- | ----- | ----------");
            let totalLoc = 0, totalNotCovered = 0;
            for (const c of coverage) {
              const total = Number(c.numLocations || 0);
              const notCovered = Number(c.numLocationsNotCovered || 0);
              const covered = total - notCovered;
              totalLoc += total;
              totalNotCovered += notCovered;
              const pct = total > 0 ? ((covered / total) * 100).toFixed(1) + "%" : "n/a";
              console.log(`${c.name} | ${covered} | ${total} | ${pct}`);
            }
            const overallCovered = totalLoc - totalNotCovered;
            const overallPct = totalLoc > 0 ? ((overallCovered / totalLoc) * 100).toFixed(1) + "%" : "n/a";
            console.log("");
            console.log(`Overall coverage for validated classes: ${overallPct} (${overallCovered}/${totalLoc} lines)`);
          '
