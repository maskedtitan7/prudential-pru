name: Deploy on Merge

# --------------------------------------------------------------------------
# Personal-project version of the work MERGE_PULL_REQUEST.yml.
#
# Runs AFTER a PR has been merged into sit or qa - i.e. the actual deploy
# step that follows VALIDATE_PULL_REQUEST.yml's dry-run validation.
#
# Flow: PR opened into sit/qa -> VALIDATE_PULL_REQUEST.yml dry-run validates
#       PR approved + merged -> THIS workflow fires on push -> real deploy
#
# NOTE: this diffs HEAD^ (the commit before the merge) against HEAD, so it
# only picks up exactly what the merge introduced. This works cleanly if
# you use "Squash and merge" on your PRs (recommended - keeps one commit
# per PR on sit/qa). If you use a regular merge commit or "Rebase and
# merge" instead, this delta range may not capture exactly what you expect -
# ask me to adjust it if you pick a different merge strategy.
# --------------------------------------------------------------------------

on:
  push:
    branches:
      - sit
      - uat
      - prod

    paths:
      - "force-app/**"

jobs:
  deploy:
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Salesforce CLI + sfdx-git-delta
        run: |
          npm install --global @salesforce/cli@latest
          sf plugins install sfdx-git-delta

      - name: Environment Sanity Check
        run: |
          sf --version
          sf plugins
          node -v

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ----------------------------------------------------------------------
      # SGD Delta (just what this merge introduced)
      # ----------------------------------------------------------------------
      - name: Generate Delta Package
        run: |
          mkdir force-app-delta
          sf sgd source delta \
            --to HEAD \
            --from HEAD^ \
            --output-dir force-app-delta \
            --source-dir force-app \
            --api-version 66.0 \
            --generate-delta

      - name: Print Commit SHA Used In Delta
        run: |
          echo "================ COMMIT SHA (DELTA RANGE) ================"
          echo "From (HEAD^): $(git rev-parse HEAD^)"
          echo "To   (HEAD) : $(git rev-parse HEAD)"
          echo "============================================================"

      - name: Show Delta Structure
        run: ls -R force-app-delta || echo "No delta generated"

      - name: Print Generated package.xml
        run: |
          if [ -f force-app-delta/package/package.xml ]; then
            echo "================ PACKAGE.XML ================"
            cat force-app-delta/package/package.xml
          else
            echo "No package.xml generated"
          fi

      - name: Print Generated destructiveChanges.xml
        run: |
          if [ -f force-app-delta/destructiveChanges/destructiveChanges.xml ]; then
            echo "========== DESTRUCTIVE CHANGES XML =========="
            cat force-app-delta/destructiveChanges/destructiveChanges.xml
          else
            echo "No destructiveChanges.xml generated"
          fi

      # ----------------------------------------------------------------------
      # Resolve Environment From Branch
      # ----------------------------------------------------------------------
      - name: Resolve Environment Mapping
        id: resolve_env
        run: |
          case "${{ github.ref_name }}" in
            sit)
              ENV_NAME="SIT"
              AUTH_SECRET="SF_AUTH_URL_SIT"
              ;;
            uat)
              ENV_NAME="UAT"
              AUTH_SECRET="SF_AUTH_URL_UAT"
              ;;
            *)
              echo "::error::Branch '${{ github.ref_name }}' not supported. Exiting."
              exit 1
              ;;
          esac

          echo "Resolved Environment: $ENV_NAME"
          echo "Using Auth Secret: $AUTH_SECRET"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "auth_secret=$AUTH_SECRET" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # Authenticate to Target Org
      # ----------------------------------------------------------------------
      - name: Authenticate to Target Org
        run: |
          case "${{ steps.resolve_env.outputs.auth_secret }}" in
            SF_AUTH_URL_SIT)
              AUTH_VALUE="${{ secrets.SF_AUTH_URL_SIT }}"
              ;;
            SF_AUTH_URL_UAT)
              AUTH_VALUE="${{ secrets.SF_AUTH_URL_UAT }}"
              ;;
            *)
              echo "::error::No matching auth secret found"
              exit 1
              ;;
          esac

          if [ -z "$AUTH_VALUE" ]; then
            echo "::error::Auth secret is empty!"
            exit 1
          fi

          echo "$AUTH_VALUE" > token.txt
          sf auth sfdxurl store -f token.txt -a myOrg -s
          rm token.txt

      - name: Verify Auth
        run: sf org list

      # ----------------------------------------------------------------------
      # Deploy to Target Org (Actual - no --dry-run)
      # ----------------------------------------------------------------------
      - name: Deploy Delta to Target Org
        run: |
          if [ ! -f force-app-delta/package/package.xml ]; then
            echo "No SF changes found. Deployment skipped."
            exit 0
          fi

          NUMBER_OF_COMPONENTS=$(grep -o "<members>" force-app-delta/package/package.xml | wc -l)

          if [ "$(grep -Ec 'name>Apex(Class|Trigger)' force-app-delta/package/package.xml || true)" -lt 1 ]; then
            echo "Deploying delta without running Apex tests ($NUMBER_OF_COMPONENTS components)"

            sf project deploy start \
              --ignore-warnings \
              --ignore-conflicts \
              --manifest force-app-delta/package/package.xml \
              --test-level NoTestRun \
              --target-org myOrg \
              --wait 100 \
              --api-version 66.0 \
              --json | tee deploy-result.json

          else
            echo "Apex detected in delta."

            SPECIFIED_TESTS=$(find force-app-delta/force-app -type f \( -iname "*Test.cls" -o -iname "*test.cls" \) \
              | sed 's#.*/##' \
              | sed 's/\.cls$//' \
              | tr '\n' ' ')

            if [ -z "$SPECIFIED_TESTS" ]; then
              echo "::error::You are committing Apex Classes or Triggers without including any test class."
              exit 1
            fi

            echo "Executing the following Test Classes: $SPECIFIED_TESTS"

            sf project deploy start \
              --ignore-warnings \
              --ignore-conflicts \
              --manifest force-app-delta/package/package.xml \
              --test-level RunSpecifiedTests \
              $(for t in $SPECIFIED_TESTS; do echo --tests "$t"; done) \
              --target-org myOrg \
              --wait 100 \
              --api-version 66.0 \
              --json | tee deploy-result.json
          fi

      # ----------------------------------------------------------------------
      # Destructive Changes Deployment (Non-blocking)
      # ----------------------------------------------------------------------
      - name: Deploy Destructive Changes (Non-blocking)
        if: always()
        continue-on-error: true
        run: |
          FILE="force-app-delta/destructiveChanges/destructiveChanges.xml"

          if [ -f "$FILE" ] && grep -q "<types>" "$FILE"; then
            echo "Destructive changes detected."
            cat "$FILE"

            sf project deploy start \
              --ignore-warnings \
              --manifest force-app-delta/package/package.xml \
              --post-destructive-changes "$FILE" \
              --test-level NoTestRun \
              --target-org myOrg \
              --wait 100 \
              --api-version 66.0
          else
            echo "No destructive changes found."
          fi

      # ----------------------------------------------------------------------
      # Apex Test Results & Coverage Summary
      # ----------------------------------------------------------------------
      - name: Apex Test Results & Coverage Summary
        if: always()
        run: |
          if [ ! -f deploy-result.json ]; then
            echo "No deploy-result.json found - no tests were run."
            exit 0
          fi

          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("deploy-result.json", "utf8"));
            const result = payload.result || {};
            const rt = (result.details && result.details.runTestResult) || result.runTestResult;

            if (!rt) {
              console.log("No Apex tests were run as part of this deployment.");
              process.exit(0);
            }

            const successes = rt.successes || [];
            const failures = rt.failures || [];
            const coverage = (rt.codeCoverage || []).slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""));

            console.log(`Tests run: ${rt.numTestsRun || successes.length + failures.length} | Failures: ${rt.numFailures || failures.length}`);
            console.log("");
            console.log("Class | Method | Result");
            console.log("----- | ------ | ------");
            for (const s of successes) console.log(`${s.name} | ${s.methodName} | PASS`);
            for (const f of failures) console.log(`${f.name} | ${f.methodName} | FAIL - ${(f.message || "").replace(/\n/g, " ")}`);

            console.log("");
            console.log("Class | Covered | Total | Coverage %");
            console.log("----- | ------- | ----- | ----------");
            let totalLoc = 0, totalNotCovered = 0;
            for (const c of coverage) {
              const total = Number(c.numLocations || 0);
              const notCovered = Number(c.numLocationsNotCovered || 0);
              const covered = total - notCovered;
              totalLoc += total;
              totalNotCovered += notCovered;
              const pct = total > 0 ? ((covered / total) * 100).toFixed(1) + "%" : "n/a";
              console.log(`${c.name} | ${covered} | ${total} | ${pct}`);
            }
            const overallCovered = totalLoc - totalNotCovered;
            const overallPct = totalLoc > 0 ? ((overallCovered / totalLoc) * 100).toFixed(1) + "%" : "n/a";
            console.log("");
            console.log(`Overall coverage for deployed classes: ${overallPct} (${overallCovered}/${totalLoc} lines)`);
          '